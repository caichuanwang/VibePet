name: Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (MAJOR.MINOR.PATCH)
        required: true
        default: 0.2.0
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package macOS app
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Build universal package
        run: ./Scripts/package-release.sh "$PACKAGE_VERSION" "$RUNNER_TEMP/package"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: VibePet-v${{ inputs.version }}-macos-universal
          path: |
            ${{ runner.temp }}/package/VibePet-v${{ inputs.version }}-macos-universal.zip
            ${{ runner.temp }}/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
